# Declare recurring jobs here; application jobs run on default or marketing.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: default
    schedule: every hour at minute 12
  purge_expired_sessions:
    class: SessionCleanupJob
    queue: default
    schedule: "0 3 * * * Etc/UTC"
  purge_expired_invitations:
    class: InvitationCleanupJob
    queue: default
    schedule: "15 3 * * * Etc/UTC"
  billing_notice_sweep:
    class: BillingNoticeSweepJob
    queue: default
    schedule: "0 8 * * * Etc/UTC"
  purge_billing_events:
    class: BillingEventCleanupJob
    queue: default
    schedule: "30 3 * * * Etc/UTC"
