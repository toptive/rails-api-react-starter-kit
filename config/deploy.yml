# Kamal 2, one Rails + SPA image; shared infrastructure is not an accessory.
# Replace host, domain, proxy subnet and bucket before the first deploy.
service: starter_kit
image: starter_kit
servers:
  web:
    hosts:
      - CHANGE_ME_SERVER_IP
    options:
      memory: 400m
proxy:
  ssl: true
  host: CHANGE_ME.toptive.dev
  app_port: 80
  # Keep the default header sanitization for direct internet traffic.
  forward_headers: false
  healthcheck:
    path: /health
    interval: 3
    timeout: 5
registry:
  # helperflow convention: on-server registry, reached by the native builder.
  server: 127.0.0.1:5000
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  remote: ssh://root@CHANGE_ME_SERVER_IP
  args:
    VITE_API_URL: ""
    VITE_PUBLIC_URL: https://CHANGE_ME.toptive.dev
    VITE_SITE_INDEXING: "0"
    VITE_PRERENDER_API_URL: ""
ssh:
  user: root
env:
  clear:
    RAILS_ENV: production
    APP_NAME: StarterKit
    PORT: "3000"
    RAILS_MAX_THREADS: "5"
    WEB_CONCURRENCY: "0"
    JOB_CONCURRENCY: "1"
    SOLID_QUEUE_IN_PUMA: "true"
    DB_HOST: postgres
    PUBLIC_URL: https://CHANGE_ME.toptive.dev
    SPA_ORIGIN: https://CHANGE_ME.toptive.dev
    API_ORIGIN: https://CHANGE_ME.toptive.dev
    TENANCY: multi
    SIGNUP_MODE: invite
    SITE_INDEXING: "0"
    TRUSTED_PROXY_CIDRS: CHANGE_ME_KAMAL_SUBNET
    MAIL_FROM: hello@CHANGE_ME.toptive.dev
    MAIL_FROM_NAME: StarterKit
    S3_BUCKET: CHANGE_ME_UPLOADS_BUCKET
    S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
    S3_REGION: us-east-1
    BILLING_ENABLED: "false"
    BILLING_MODE: test
    BILLING_RENEWAL_NOTICES: "false"
    TURNSTILE_REQUIRED: "false"
    RAILS_LOG_LEVEL: info
  secret:
    - SECRET_KEY_BASE
    - STARTER_KIT_DATABASE_PASSWORD
    # Enable provider env entries together with their references in .kamal/secrets.
    # - SMTP_USERNAME
    # - SMTP_PASSWORD
    # - S3_ACCESS_KEY_ID
    # - S3_SECRET_ACCESS_KEY
    # - GOOGLE_CLIENT_ID
    # - GOOGLE_CLIENT_SECRET
    # - SENTRY_DSN
    # - OPENROUTER_API_KEY
    # - FAL_KEY
    # - GOOGLE_API_KEY
    # - POSTHOG_API_KEY
    # - TURNSTILE_SECRET_KEY
    # - STRIPE_TEST_SECRET_KEY
    # - STRIPE_TEST_WEBHOOK_SECRET
    # - STRIPE_LIVE_SECRET_KEY
    # - STRIPE_LIVE_WEBHOOK_SECRET
volumes:
  - starter_kit_storage:/rails/storage
asset_path: /rails/public/assets
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  migrate: app exec --primary "bin/rails db:prepare"
retain_containers: 3
