<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script data-bootstrap>
      // Keep this prefix in sync with storage-keys.ts; bin/rename updates it for each product.
      const appearance = localStorage.getItem("starterkit:appearance")
      const dark = appearance === "dark" || (!appearance && matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.classList.toggle("dark", dark)
      document.documentElement.style.colorScheme = dark ? "dark" : "light"
    </script>
  </head>
  <body><div id="root"><!--landing--></div><script type="module" src="/src/main.tsx"></script></body>
</html>
